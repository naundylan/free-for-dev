name: Notify Free-for-dev Changes

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get upstream content
        run: |
          git remote add upstream https://github.com/ripienaar/free-for-dev.git || true
          git fetch upstream master --depth=2
          git show upstream/master:README.md > /tmp/readme.txt

      - name: Pick 2 random tools (no repeat)
        run: |
          python3 << 'PYEOF'
          import re, random, json

          with open("/tmp/readme.txt", "r") as f:
              content = f.read()

          # Parse tool kèm category (heading trước đó)
          tools_with_category = []
          current_category = "Uncategorized"
          for line in content.split('\n'):
              heading = re.match(r'^#{1,3}\s+(.+)$', line)
              if heading:
                  current_category = heading.group(1).strip()
              m = re.match(r'^\s*[-*]\s+\[([^\]]+)\]\(([^)]+)\)\s*[-–]\s*(.+)$', line)
              if m:
                  tools_with_category.append((m.group(1), m.group(2), m.group(3), current_category))

          if len(tools_with_category) < 2:
              print("Không đủ tool để random")
              exit(0)

          history_file = '.sent_history'
          try:
              with open(history_file) as f:
                  sent = json.load(f)
          except:
              sent = []

          available = [i for i in range(len(tools_with_category)) if i not in sent]
          if len(available) < 2:
              print("Reset lịch sử...")
              sent = []
              available = list(range(len(tools_with_category)))

          chosen_indices = random.sample(available, 2)
          picked = [tools_with_category[i] for i in chosen_indices]

          sent.extend(chosen_indices)
          with open(history_file, 'w') as f:
              json.dump(sent, f)

          # Lưu từng tool riêng
          for idx, (name, url, desc, category) in enumerate(picked):
              tool_text = f"- {name} ({url}): {desc}"
              with open(f"/tmp/tool_{idx}.txt", "w") as f:
                  f.write(tool_text)
              with open(f"/tmp/tool_{idx}_meta.json", "w") as f:
                  json.dump({"name": name, "url": url, "category": category}, f, ensure_ascii=False)

          print(f"Picked: {[p[0] for p in picked]}")
          PYEOF

      - name: Summarize and send tool 0
        run: |
          python3 << 'PYEOF'
          import json, subprocess, re, requests, os

          with open("/tmp/tool_0_meta.json") as f:
              meta = json.load(f)
          with open("/tmp/tool_0.txt") as f:
              tool_text = f.read()
          with open(".github/prompt.txt") as f:
              prompt = f.read()

          payload = {
              "model": "poolside/laguna-xs-2.1:free",
              "max_tokens": 1024,
              "messages": [{"role": "user", "content": prompt + "\n\n" + tool_text}]
          }

          import urllib.request, urllib.error
          import json as jsonlib

          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=jsonlib.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                  "Content-Type": "application/json"
              }
          )
          with urllib.request.urlopen(req) as resp:
              data = jsonlib.loads(resp.read())

          summary = data["choices"][0]["message"]["content"]

          # Filter </think> blocks
          summary = re.sub(r'<think>.*?</think>', '', summary, flags=re.DOTALL).strip()
          summary = re.sub(r'</think>', '', summary).strip()

          # Build tin nhắn
          name = meta["name"]
          category = meta["category"]
          header = f"🎲 Tool random hôm nay!\n📂 {category}\n\n"
          footer = "\n\nhttps://github.com/ripienaar/free-for-dev"
          full_text = header + summary + footer

          LIMIT = 4000
          chunks = []
          current = ""
          for para in full_text.split('\n\n'):
              if len(current) + len(para) + 2 > LIMIT:
                  if current:
                      chunks.append(current.strip())
                  current = para
              else:
                  current += '\n\n' + para if current else para
          if current:
              chunks.append(current.strip())

          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']

          # Lưu summary để dùng khi bấm lưu
          save_data = jsonlib.dumps({
              "name": name,
              "category": category,
              "content": summary
          })
          with open("/tmp/tool_0_summary.json", "w") as f:
              f.write(save_data)

          for i, chunk in enumerate(chunks):
              is_last = (i == len(chunks) - 1)
              msg_payload = {
                  "chat_id": chat_id,
                  "text": chunk,
                  "disable_web_page_preview": True
              }
              if is_last:
                  msg_payload["reply_markup"] = {
                      "inline_keyboard": [[
                          {"text": f"✅ Lưu [{name}]", "callback_data": f"save_random:0"},
                          {"text": "❌ Bỏ qua", "callback_data": "skip"}
                      ]]
                  }
              requests.post(f"https://api.telegram.org/bot{token}/sendMessage", json=msg_payload)
              print(f"Tool 0 chunk {i+1}/{len(chunks)} sent")
          PYEOF
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Summarize and send tool 1
        run: |
          python3 << 'PYEOF'
          import json, re, requests, os, urllib.request
          import json as jsonlib

          with open("/tmp/tool_1_meta.json") as f:
              meta = json.load(f)
          with open("/tmp/tool_1.txt") as f:
              tool_text = f.read()
          with open(".github/prompt.txt") as f:
              prompt = f.read()

          payload = {
              "model": "poolside/laguna-xs.2:free",
              "max_tokens": 1024,
              "messages": [{"role": "user", "content": prompt + "\n\n" + tool_text}]
          }

          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=jsonlib.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                  "Content-Type": "application/json"
              }
          )
          with urllib.request.urlopen(req) as resp:
              data = jsonlib.loads(resp.read())

          summary = data["choices"][0]["message"]["content"]
          summary = re.sub(r'<think>.*?</think>', '', summary, flags=re.DOTALL).strip()
          summary = re.sub(r'</think>', '', summary).strip()

          name = meta["name"]
          category = meta["category"]
          header = f"🎲 Tool random hôm nay!\n📂 {category}\n\n"
          footer = "\n\nhttps://github.com/ripienaar/free-for-dev"
          full_text = header + summary + footer

          LIMIT = 4000
          chunks = []
          current = ""
          for para in full_text.split('\n\n'):
              if len(current) + len(para) + 2 > LIMIT:
                  if current:
                      chunks.append(current.strip())
                  current = para
              else:
                  current += '\n\n' + para if current else para
          if current:
              chunks.append(current.strip())

          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']

          for i, chunk in enumerate(chunks):
              is_last = (i == len(chunks) - 1)
              msg_payload = {
                  "chat_id": chat_id,
                  "text": chunk,
                  "disable_web_page_preview": True
              }
              if is_last:
                  msg_payload["reply_markup"] = {
                      "inline_keyboard": [[
                          {"text": f"✅ Lưu [{name}]", "callback_data": f"save_random:1"},
                          {"text": "❌ Bỏ qua", "callback_data": "skip"}
                      ]]
                  }
              requests.post(f"https://api.telegram.org/bot{token}/sendMessage", json=msg_payload)
              print(f"Tool 1 chunk {i+1}/{len(chunks)} sent")
          PYEOF
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Check for upstream changes
        id: upstream
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/ripienaar/free-for-dev.git HEAD | cut -f1)
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          if [ -f .last_sha ]; then
            LAST_SHA=$(cat .last_sha)
            if [ "$UPSTREAM_SHA" != "$LAST_SHA" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Get diff and classify changes
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git diff upstream/master~1 upstream/master -- '*.md' ':!package-lock.json' | head -300 > /tmp/upstream_diff.txt

          python3 << 'PYEOF'
          import re, json

          try:
              with open('.sent_history') as f:
                  sent_indices = json.load(f)
          except:
              sent_indices = []

          with open("/tmp/readme.txt") as f:
              content = f.read()

          all_tools = re.findall(r'^\s*[-*]\s+\[([^\]]+)\]\(([^)]+)\)\s*[-–]\s*(.+)$', content, re.MULTILINE)
          sent_names = {all_tools[i][0] for i in sent_indices if i < len(all_tools)}

          with open("/tmp/upstream_diff.txt") as f:
              diff = f.read()

          new_tools = []
          updated_tools = []

          for line in diff.split('\n'):
              if not line.startswith('+') or line.startswith('+++'):
                  continue
              line = line[1:].strip()
              m = re.match(r'[-*]\s+\[([^\]]+)\]\(([^)]+)\)\s*[-–]\s*(.+)$', line)
              if m:
                  name, url, desc = m.groups()
                  if name in sent_names:
                      updated_tools.append(f"🔄 *{name}* — {desc}\n{url}")
                  else:
                      new_tools.append(f"🆕 *{name}* — {desc}\n{url}")

          with open("/tmp/diff_classified.json", "w") as f:
              json.dump({"new": new_tools, "updated": updated_tools}, f, ensure_ascii=False)

          print(f"New: {len(new_tools)}, Updated: {len(updated_tools)}")
          PYEOF

      - name: Build and send diff summary
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python3 << 'PYEOF'
          import json, re, requests, os, urllib.request
          import json as jsonlib

          with open(".github/prompt_diff.txt") as f:
              prompt = f.read()
          with open("/tmp/upstream_diff.txt") as f:
              diff = f.read()
          with open("/tmp/diff_classified.json") as f:
              classified = json.load(f)

          payload = {
              "model": "poolside/laguna-xs.2.1:free",
              "max_tokens": 1024,
              "messages": [{"role": "user", "content": prompt + "\n\n" + diff}]
          }

          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=jsonlib.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                  "Content-Type": "application/json"
              }
          )
          with urllib.request.urlopen(req) as resp:
              data = jsonlib.loads(resp.read())

          summary = data["choices"][0]["message"]["content"]
          summary = re.sub(r'<think>.*?</think>', '', summary, flags=re.DOTALL).strip()
          summary = re.sub(r'</think>', '', summary).strip()

          classify_text = ""
          if classified["updated"]:
              classify_text += "\n\n📌 *Tool bạn đã biết có thay đổi:*\n" + "\n".join(classified["updated"])
          if classified["new"]:
              classify_text += "\n\n✨ *Tool mới hoàn toàn:*\n" + "\n".join(classified["new"])

          full_text = "🔔 free-for-dev có cập nhật mới!\n\n" + summary + classify_text + "\n\nhttps://github.com/ripienaar/free-for-dev"

          LIMIT = 4000
          chunks = []
          current = ""
          for para in full_text.split('\n\n'):
              if len(current) + len(para) + 2 > LIMIT:
                  if current:
                      chunks.append(current.strip())
                  current = para
              else:
                  current += '\n\n' + para if current else para
          if current:
              chunks.append(current.strip())

          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']

          for i, chunk in enumerate(chunks):
              is_last = (i == len(chunks) - 1)
              msg_payload = {
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "Markdown",
                  "disable_web_page_preview": True
              }
              if is_last:
                  msg_payload["reply_markup"] = {
                      "inline_keyboard": [[
                          {"text": "✅ Lưu update", "callback_data": "save_diff"},
                          {"text": "❌ Bỏ qua", "callback_data": "skip"}
                      ]]
                  }
              requests.post(f"https://api.telegram.org/bot{token}/sendMessage", json=msg_payload)
          PYEOF
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save new SHA and history
        if: steps.upstream.outputs.changed == 'true'
        run: |
          echo "${{ steps.upstream.outputs.upstream_sha }}" > .last_sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_sha .sent_history
          git commit -m "chore: update SHA and sent history" || echo "Nothing to commit"
          git push

      - name: Save history after random (if no upstream change)
        if: steps.upstream.outputs.changed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .sent_history
          git commit -m "chore: update sent history" || echo "Nothing to commit"
          git push
