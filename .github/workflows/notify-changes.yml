name: Notify Free-for-dev Changes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commit from upstream
        id: upstream
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/ripienaar/free-for-dev.git HEAD | cut -f1)
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

      - name: Load last known SHA
        id: last
        run: |
          if [ -f .last_sha ]; then
            echo "last_sha=$(cat .last_sha)" >> $GITHUB_OUTPUT
          else
            echo "last_sha=" >> $GITHUB_OUTPUT
          fi

      - name: Compare SHAs
        id: compare
        run: |
          if [ "${{ steps.upstream.outputs.upstream_sha }}" != "${{ steps.last.outputs.last_sha }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Get diff from upstream
        if: steps.compare.outputs.changed == 'true'
        run: |
          git remote add upstream https://github.com/ripienaar/free-for-dev.git || true
          git fetch upstream main --depth=2
          git diff upstream/main~1 upstream/main \
            -- '*.md' '*.json' '*.yaml' '*.yml' \
            ':!package-lock.json' ':!yarn.lock' \
            | head -500 > /tmp/upstream_diff.txt
          echo "Diff size: $(wc -c < /tmp/upstream_diff.txt) bytes"

      - name: Summarize with AI via OpenRouter
        if: steps.compare.outputs.changed == 'true'
        run: |
          DIFF=$(cat /tmp/upstream_diff.txt)

          # Viết prompt ra file để tránh lỗi YAML với ký tự đặc biệt
          cat > /tmp/prompt.txt << 'PROMPT_EOF'
Ban la tro ly phan tich changelog cho developer Viet Nam.

Duoi day la git diff tu repo free-for-dev (danh sach cong cu/dich vu free cho developer).

Hay phan tich va tra loi DUNG theo format sau, KHONG them bat ky noi dung nao ngoai format:

Neu co tool MOI duoc them vao, voi MOI tool viet:
🛠 [Ten Tool]
📌 Ve gi: [1 cau mo ta linh vuc, vi du: dich vu host backend mien phi]
🎁 Free tier: [gioi han cu the, vi du: 512MB RAM, 1GB storage, khong gioi han request]
💡 Dung khi: [2-3 usecase thuc te ngan gon, vi du: host API nho, deploy side project, test MVP]

Neu co tool BI XOA:
❌ [Ten Tool] — [ly do neu co, neu khong thi ghi: khong ro ly do]

Neu co tool duoc CAP NHAT thong tin:
✏️ [Ten Tool] — [thay doi gi cu the]

Neu KHONG co thay doi nao dang chu y (chi fix typo, format...):
ℹ️ Khong co tool moi, chi cap nhat nho.

---
PROMPT_EOF

          # Gộp prompt + diff
          FULL_PROMPT=$(cat /tmp/prompt.txt; echo "DIFF:"; echo "$DIFF")

          # Gọi OpenRouter API
          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer ${{ secrets.OPENROUTER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$FULL_PROMPT" '{
              model: "nvidia/nemotron-3-super-120b-a12b:free",
              max_tokens: 2048,
              messages: [{ role: "user", content: $content }]
            }')")

          echo "$RESPONSE" | jq -r '.choices[0].message.content // "Khong the tom tat duoc."' > /tmp/summary.txt
          echo "Summary generated:"
          cat /tmp/summary.txt

      - name: Send to Telegram
        if: steps.compare.outputs.changed == 'true'
        run: |
          SUMMARY=$(cat /tmp/summary.txt | head -c 3500)

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${{ secrets.TELEGRAM_CHAT_ID }}" \
              --arg summary "$SUMMARY" \
              '{
                chat_id: $chat_id,
                text: ("🔔 free-for-dev cap nhat moi!\n\n━━━━━━━━━━━━━━━\n" + $summary + "\n━━━━━━━━━━━━━━━\n🔗 https://github.com/ripienaar/free-for-dev"),
                disable_web_page_preview: true
              }')"

      - name: Save new SHA
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "${{ steps.upstream.outputs.upstream_sha }}" > .last_sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_sha
          git commit -m "chore: update last known upstream SHA"
          git push
