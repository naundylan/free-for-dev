name: Notify Free-for-dev Changes

on:
  schedule:
    - cron: '0 */6 * * *'  # Chạy mỗi 6 tiếng
  workflow_dispatch:        # Cho phép chạy thủ công

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commit from upstream
        id: upstream
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/ripienaar/free-for-dev.git HEAD | cut -f1)
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

      - name: Load last known SHA
        id: last
        run: |
          if [ -f .last_sha ]; then
            echo "last_sha=$(cat .last_sha)" >> $GITHUB_OUTPUT
          else
            echo "last_sha=" >> $GITHUB_OUTPUT
          fi

      - name: Compare SHAs
        id: compare
        run: |
          if [ "${{ steps.upstream.outputs.upstream_sha }}" != "${{ steps.last.outputs.last_sha }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Get diff from upstream
        if: steps.compare.outputs.changed == 'true'
        id: diff
        run: |
          git remote add upstream https://github.com/ripienaar/free-for-dev.git || true
          git fetch upstream main --depth=2

          # Lấy toàn bộ diff của tất cả file (trừ file config, lock)
          DIFF=$(git diff upstream/main~1 upstream/main \
            -- '*.md' '*.json' '*.yaml' '*.yml' \
            ':!package-lock.json' ':!yarn.lock' \
            | head -500)

          # Lưu vào file thay vì env để tránh giới hạn size
          echo "$DIFF" > /tmp/upstream_diff.txt

      - name: Summarize with AI via OpenRouter
        if: steps.compare.outputs.changed == 'true'
        id: summary
        run: |
          DIFF=$(cat /tmp/upstream_diff.txt)

          PROMPT="Bạn là trợ lý phân tích changelog cho developer Việt Nam.

Dưới đây là git diff từ repo free-for-dev (danh sách công cụ/dịch vụ free cho developer).

Hãy phân tích và trả lời ĐÚNG theo format sau, KHÔNG thêm bất kỳ nội dung nào ngoài format:

Nếu có tool MỚI được thêm vào, với MỖI tool viết:
🛠 [Tên Tool]
📌 Về gì: [1 câu mô tả lĩnh vực, ví dụ: dịch vụ host backend miễn phí]
🎁 Free tier: [giới hạn cụ thể, ví dụ: 512MB RAM, 1GB storage, không giới hạn request]
💡 Dùng khi: [2-3 usecase thực tế ngắn gọn, ví dụ: host API nhỏ, deploy side project, test MVP]

Nếu có tool BỊ XÓA:
❌ [Tên Tool] — [lý do nếu có, nếu không thì ghi 'không rõ lý do']

Nếu có tool được CẬP NHẬT thông tin:
✏️ [Tên Tool] — [thay đổi gì cụ thể]

Nếu KHÔNG có thay đổi nào đáng chú ý (chỉ fix typo, format...):
ℹ️ Không có tool mới, chỉ cập nhật nhỏ.

---
DIFF:
$DIFF"

          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "nvidia/nemotron-3-super-120b-a12b:free",
              max_tokens: 2048,
              messages: [
                {
                  role: "user",
                  content: $prompt
                }
              ]
            }')

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer ${{ secrets.OPENROUTER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "$RESPONSE" | jq -r '.choices[0].message.content // "⚠️ Không thể tóm tắt được."' > /tmp/summary.txt

      - name: Send to Telegram
        if: steps.compare.outputs.changed == 'true'
        run: |
          SUMMARY=$(cat /tmp/summary.txt)

          # Telegram giới hạn 4096 ký tự, cắt nếu quá dài
          SUMMARY=$(echo "$SUMMARY" | head -c 3500)

          MESSAGE="🔔 *free\-for\-dev có cập nhật mới\!*

━━━━━━━━━━━━━━━
${SUMMARY}
━━━━━━━━━━━━━━━
🔗 [Xem repo](https://github.com/ripienaar/free-for-dev)"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${{ secrets.TELEGRAM_CHAT_ID }}" \
              --arg text "$MESSAGE" \
              '{chat_id: $chat_id, text: $text, parse_mode: "MarkdownV2", disable_web_page_preview: true}')"

      - name: Save new SHA
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "${{ steps.upstream.outputs.upstream_sha }}" > .last_sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_sha
          git commit -m "chore: update last known upstream SHA"
          git push
