name: Notify Free-for-dev Changes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest commit from upstream
        id: upstream
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/ripienaar/free-for-dev.git HEAD | cut -f1)
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

      - name: Load last known SHA
        id: last
        run: |
          if [ -f .last_sha ]; then
            echo "last_sha=$(cat .last_sha)" >> $GITHUB_OUTPUT
            echo "first_run=false" >> $GITHUB_OUTPUT
          else
            echo "last_sha=" >> $GITHUB_OUTPUT
            echo "first_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Compare SHAs
        id: compare
        run: |
          if [ "${{ steps.last.outputs.first_run }}" == "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.upstream.outputs.upstream_sha }}" != "${{ steps.last.outputs.last_sha }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Get content from upstream
        if: steps.compare.outputs.changed == 'true'
        run: |
          git remote add upstream https://github.com/ripienaar/free-for-dev.git || true
          git fetch upstream master --depth=2

          if [ "${{ steps.last.outputs.first_run }}" == "true" ]; then
            # Lần đầu: lấy full README nhưng giới hạn 300 dòng để tránh quá dài
            git show upstream/master:README.md | head -300 > /tmp/upstream_content.txt
            cp .github/prompt.txt /tmp/active_prompt.txt
          else
            git diff upstream/master~1 upstream/master -- '*.md' '*.json' '*.yaml' '*.yml' ':!package-lock.json' ':!yarn.lock' | head -300 > /tmp/upstream_content.txt
            cp .github/prompt_diff.txt /tmp/active_prompt.txt
          fi

          # Gộp prompt + content vào 1 file
          cat /tmp/active_prompt.txt /tmp/upstream_content.txt > /tmp/full_prompt.txt

      - name: Summarize with AI via OpenRouter
        if: steps.compare.outputs.changed == 'true'
        run: |
          # Dùng python để build JSON payload từ file, tránh lỗi "Argument list too long"
          python3 - << 'PYEOF'
          import json, subprocess

          with open("/tmp/full_prompt.txt", "r") as f:
              content = f.read()

          payload = {
              "model": "z-ai/glm-4-5-air:free",
              "max_tokens": 2048,
              "messages": [{"role": "user", "content": content}]
          }

          with open("/tmp/payload.json", "w") as f:
              json.dump(payload, f)

          print("Payload written, size:", len(content), "chars")
          PYEOF

      - name: Call OpenRouter API
        if: steps.compare.outputs.changed == 'true'
        run: |
          curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer ${{ secrets.OPENROUTER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json \
            > /tmp/response_raw.txt
          echo "=== RAW RESPONSE ==="
          cat /tmp/response_raw.txt
          echo "=== END ==="
          jq -r '.choices[0].message.content // "Không thể tóm tắt được."' /tmp/response_raw.txt > /tmp/summary.txt
          echo "Summary:"
          cat /tmp/summary.txt

      - name: Send to Telegram
        if: steps.compare.outputs.changed == 'true'
        run: |
          if [ "${{ steps.last.outputs.first_run }}" == "true" ]; then
            HEADER="📋 free-for-dev — Tổng hợp lần đầu!"
          else
            HEADER="🔔 free-for-dev có cập nhật mới!"
          fi
          SUMMARY=$(cat /tmp/summary.txt | head -c 3500)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${{ secrets.TELEGRAM_CHAT_ID }}" \
              --arg header "$HEADER" \
              --arg summary "$SUMMARY" \
              '{
                chat_id: $chat_id,
                text: ($header + "\n\n" + $summary + "\n\nhttps://github.com/ripienaar/free-for-dev"),
                disable_web_page_preview: true
              }')"

      - name: Save new SHA
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "${{ steps.upstream.outputs.upstream_sha }}" > .last_sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_sha
          git commit -m "chore: update last known upstream SHA"
          git push
